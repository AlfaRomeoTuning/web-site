version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      # react-dom pins react to the same version; separate PRs can't install.
      react:
        patterns:
          - react
          - react-dom
      npm-minor-patch:
        update-types:
          - minor
          - patch
