name: Google Cloud Run Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy in flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# GCP side (Workload Identity Federation, deploy service account, Artifact Registry
# repository) is created once by .github/gcp-setup.sh.
env:
  PROJECT_ID: ${{ secrets.GCR_PROJECT }}
  RUN_REGION: us-central1
  SERVICE_NAME: alfatuningapp-web-site
  AR_REPO: web-site

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for Workload Identity Federation
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Ship the exact build the ci job tested. The image is tagged with the commit SHA.
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: .docker/build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # The image is Caddy plus the static build, so it is built on the runner;
      # the deploy account only needs to push to Artifact Registry.
      - name: Build & Push
        run: |-
          IMAGE="$RUN_REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE_NAME:$GITHUB_SHA"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$RUN_REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
        working-directory: .docker

      # The service already allows unauthenticated access; that IAM policy stays
      # as is, so the deploy account doesn't need permission to change it.
      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy "$SERVICE_NAME" \
            --region "$RUN_REGION" \
            --image "$IMAGE" \
            --platform "managed"
