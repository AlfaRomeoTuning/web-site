name: CI

on:
  pull_request:
    branches:
      - main
  # Called by deploy.yml on every push to main, so a deploy only ships a build that passed here.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # react-snap's bundled Chromium needs libXss; the runner's Google Chrome install covers the rest.
      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-recommends libxss1

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
        env:
          CI: true

      # postbuild runs react-snap and the sitemap generator.
      - name: Build
        run: npm run build

      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build
          if-no-files-found: error
          retention-days: 7
