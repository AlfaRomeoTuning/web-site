name: CI

on:
  pull_request:
    branches:
      - main
  # Called by deploy.yml on every push to main, so a deploy only ships a build that passed here.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
        env:
          CI: true

      # vite build, then the sitemap generator, then Puppeteer prerendering of every sitemap route.
      # npm ci's puppeteer postinstall downloads the Chrome it uses; the runner already has Chrome's system libraries.
      - name: Build
        run: npm run build

      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build
          if-no-files-found: error
          retention-days: 7

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A fixed release checked against its checksum, not the download script from actionlint's main branch.
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" actionlint

      - name: Run actionlint
        run: ./actionlint -color
